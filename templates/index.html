<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV & Cover Letter Tailor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 300px;
            transition: border-color 0.3s;
        }
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .result {
            display: none;
            margin-top: 30px;
        }
        .result-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .result-section h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .result-section .content {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
        }
        .result-section .content .bullet {
            margin-left: 20px;
        }
        .copy-btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 12px;
        }
        .copy-btn:hover {
            background: #5a67d8;
        }
        .copy-btn.copied {
            background: #4CAF50;
        }
        .job-title {
            font-weight: 700;
            color: #333;
            margin: 10px 0 5px 0;
        }
        @media (max-width: 768px) {
            .row {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 CV & Cover Letter Tailor</h1>
        <p class="subtitle">Paste your experience and a job description to get tailored content</p>

        <form id="tailorForm">
            <div class="row">
                <div class="form-group">
                    <label for="experience">📋 Your Experience</label>
                    <textarea id="experience" name="experience" placeholder="Paste your experience here. Format each job as:

Chief of Staff | Jubaland State | Feb 2023 - To Date
- Led resource mobilization efforts...
- Managed strategic partnerships...
- Coordinated across 15 ministries...

Senior Advisor | Ministry of Planning | Aug 2021 - Jan 2023
- Led grant acquisition...
- Developed strategic plans...
- Established partnerships..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="jobDescription">🎯 Job Description</label>
                    <textarea id="jobDescription" name="job_description" placeholder="Paste the complete job description here..." required></textarea>
                </div>
            </div>
            <button type="submit" class="btn" id="submitBtn">🚀 Generate Tailored Content</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">🤖 AI is generating your tailored content... This takes 10-20 seconds</p>
        </div>

        <div class="result" id="result">
            <h2>✅ Your Tailored Content</h2>
            
            <div class="result-section">
                <h3>📝 Professional Summary</h3>
                <div class="content" id="summaryContent"></div>
                <button class="copy-btn" onclick="copyContent('summaryContent')">📋 Copy</button>
            </div>

            <div class="result-section">
                <h3>💼 Tailored Experience</h3>
                <div class="content" id="experienceContent"></div>
                <button class="copy-btn" onclick="copyContent('experienceContent')">📋 Copy</button>
            </div>

            <div class="result-section">
                <h3>✉️ Cover Letter</h3>
                <div class="content" id="coverLetterContent"></div>
                <button class="copy-btn" onclick="copyContent('coverLetterContent')">📋 Copy</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('tailorForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const experience = document.getElementById('experience').value.trim();
            const jobDescription = document.getElementById('jobDescription').value.trim();
            
            if (!experience || !jobDescription) {
                alert('Please provide both your experience and the job description.');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').textContent = '⏳ Generating...';

            try {
                const response = await fetch('/tailor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        experience: experience,
                        job_description: jobDescription
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Display summary
                    document.getElementById('summaryContent').textContent = data.summary;
                    
                    // Display experience with formatting
                    let expHtml = '';
                    for (const [job, bullets] of Object.entries(data.experience)) {
                        expHtml += `<div class="job-title">${job}</div>`;
                        bullets.forEach(bullet => {
                            expHtml += `<div class="bullet">• ${bullet}</div>`;
                        });
                        expHtml += '<br>';
                    }
                    document.getElementById('experienceContent').innerHTML = expHtml;
                    
                    // Display cover letter
                    document.getElementById('coverLetterContent').textContent = data.cover_letter;
                    
                    document.getElementById('result').style.display = 'block';
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Network error. Please try again.');
                console.error(error);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').textContent = '🚀 Generate Tailored Content';
            }
        });

        function copyContent(elementId) {
            const element = document.getElementById(elementId);
            let text = '';
            
            if (elementId === 'experienceContent') {
                // Get plain text from experience content
                const items = element.querySelectorAll('.bullet');
                const jobTitles = element.querySelectorAll('.job-title');
                let result = '';
                jobTitles.forEach((title, index) => {
                    result += title.textContent + '\n';
                    const bullets = element.querySelectorAll('.bullet');
                    // Get bullets for this job (need to track which bullets belong to which job)
                    // Simple approach: get all bullets after this job title until next job title
                });
                // Simpler: just get text content
                text = element.textContent;
            } else {
                text = element.textContent;
            }
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector(`[onclick="copyContent('${elementId}')"]`);
                btn.textContent = '✅ Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 Copy';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
</body>
</html>
